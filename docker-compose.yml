version: '3.8'

services:
  daily-news-digest:
    build: .
    container_name: daily-news-digest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    environment:
      - DIGEST_TIME=08:00
      - DIGEST_TIMEZONE=Asia/Shanghai
