name: Daily Finance & China News Digest

on:
  schedule:
    # 主触发：北京时间 07:35 (UTC 23:35)，处于 DeepSeek 谷时优惠时段，避开整点高峰
    - cron: '35 23 * * *'
    # 容灾备用触发：北京时间 08:05 (UTC 00:05)，若主触发已成功则自动跳过，若主触发偶发丢失则自动兜底补发
    - cron: '5 0 * * *'
  workflow_dispatch: # 支持在 GitHub 页面上手动点击按钮立即测试触发

permissions:
  actions: read
  contents: read

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Fonts & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei fonts-wqy-microhei
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check If Already Sent Today (Idempotency Guard)
        id: check_sent
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TIME=$(gh run list --workflow=daily_digest.yml --status=success --limit=1 --json createdAt -q '.[0].createdAt' || echo "")
          if [ -n "$LATEST_TIME" ]; then
            NOW_EPOCH=$(date +%s)
            RUN_EPOCH=$(date -d "$LATEST_TIME" +%s 2>/dev/null || echo 0)
            DIFF_MIN=$(( (NOW_EPOCH - RUN_EPOCH) / 60 ))
            if [ $DIFF_MIN -ge 0 ] && [ $DIFF_MIN -lt 90 ]; then
              echo "今日早报已于 $DIFF_MIN 分钟前成功发送，跳过执行以防重复推送。"
              echo "already_sent=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "今日尚未成功发送，正常启动抓取与研报推送流程。"
          echo "already_sent=false" >> $GITHUB_OUTPUT

      - name: Run Daily News & Impact Digest
        if: steps.check_sent.outputs.already_sent != 'true'
        env:
          DIGEST_TIME: '08:00'
          DIGEST_TIMEZONE: 'Asia/Shanghai'
          LOOKBACK_HOURS: 24
          MAX_ITEMS_PER_SOURCE: 5
          OUTPUT_RETENTION_DAYS: 7
          COMPRESS_IMAGE: 'true'
          # 敏感信息从 GitHub 仓库 Secrets 读取
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}

          # 多引擎智能调度配置
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python main.py --run-now

      - name: Archive Generated Digest
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-digest-output
          path: output/
          retention-days: 7
