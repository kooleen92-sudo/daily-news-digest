name: Daily Finance & China News Digest

on:
  schedule:
    # 主触发：北京时间 07:05 (UTC 23:05)，大幅避开 UTC 00:00 全球排队高峰，处于 DeepSeek 谷时优惠时段
    - cron: '5 23 * * *'
    # 容灾备用触发：北京时间 07:45 (UTC 23:45)，避开 00:00 整点，若主触发已成功则自动跳过，保障 8 点前准时送达
    - cron: '45 23 * * *'
  workflow_dispatch: # 支持在 GitHub 页面上手动点击按钮立即测试触发
    inputs:
      dry_run:
        description: '仅执行预览（不发送邮件与通知，产物保存于 Actions Artifacts）'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  # 同一 workflow/ref 串行执行；备用触发会排队等待，避免主触发和备用触发并行导致重复发送
  group: daily-digest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check If Already Sent Today (Idempotency Guard)
        id: check_sent
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TODAY_BJT=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          LATEST_UTC=$(gh run list --workflow=daily_digest.yml --branch main --status=success --limit=1 --json createdAt -q '.[0].createdAt' || echo "")
          if [ -n "$LATEST_UTC" ] && [ "$LATEST_UTC" != "null" ]; then
            LATEST_BJT=$(TZ='Asia/Shanghai' date -d "$LATEST_UTC" +'%Y-%m-%d' 2>/dev/null || echo "")
            if [ "$LATEST_BJT" = "$TODAY_BJT" ]; then
              echo "今日 ($TODAY_BJT) 早报已成功发送过，跳过本次执行防止重复。"
              echo "already_sent=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "今日 ($TODAY_BJT) 尚未成功发送，正常启动抓取与研报推送流程。"
          echo "already_sent=false" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.check_sent.outputs.already_sent != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Fonts & Python Dependencies
        if: steps.check_sent.outputs.already_sent != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei fonts-wqy-microhei
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get Playwright Version
        if: steps.check_sent.outputs.already_sent != 'true'
        run: |
          echo "PLAYWRIGHT_VERSION=$(pip show playwright | grep Version | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        if: steps.check_sent.outputs.already_sent != 'true'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers & Deps
        if: steps.check_sent.outputs.already_sent != 'true'
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install-deps chromium
            python -m playwright install chromium
          fi

      - name: Restore Digest History and Archive
        if: steps.check_sent.outputs.already_sent != 'true'
        uses: actions/cache@v4
        with:
          path: |
            output/seen_history.json
            archive
          key: digest-history-${{ github.run_id }}
          restore-keys: |
            digest-history-

      - name: Run Daily News & Impact Digest
        if: steps.check_sent.outputs.already_sent != 'true'
        env:
          DIGEST_TIME: '08:00'
          DIGEST_TIMEZONE: 'Asia/Shanghai'
          LOOKBACK_HOURS: 24
          MAX_ITEMS_PER_SOURCE: 5
          OUTPUT_RETENTION_DAYS: 7
          COMPRESS_IMAGE: 'true'
          # 敏感信息从 GitHub 仓库 Secrets 读取
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}

          # 多渠道通知 Webhook
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # 多引擎智能调度配置
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::Executing in dry-run mode (preview only, no email dispatched)..."
            python main.py --dry-run
          else
            python main.py --run-now
          fi


      - name: Archive Generated Digest
        uses: actions/upload-artifact@v4
        if: always() && steps.check_sent.outputs.already_sent != 'true'
        with:
          name: daily-digest-output
          path: output/
          retention-days: 7
