name: Daily Finance & China News Digest

on:
  schedule:
    # 国际标准时间 UTC 23:50 对应北京时间 (UTC+8) 早上 07:50
    # 完美处于 DeepSeek 谷时 5 折优惠时段内，且避开整点 08:00 排队，确保 8 点前准时收到
    - cron: '50 23 * * *'
  workflow_dispatch: # 支持在 GitHub 页面上手动点击按钮立即测试触发


jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily News & Impact Digest
        env:
          DIGEST_TIME: '08:00'
          DIGEST_TIMEZONE: 'Asia/Shanghai'
          LOOKBACK_HOURS: 24
          MAX_ITEMS_PER_SOURCE: 5
          # 敏感信息从 GitHub 仓库 Secrets 读取
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}

          # 双引擎智能调度（Gemini 优先，DeepSeek 自动容灾接管）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}

          # 兼容传统单模型配置
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python main.py --run-now

      - name: Archive Generated Digest
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-digest-output
          path: output/
          retention-days: 7
